name: HiringCafe Watcher

on:
  # KNOWN UPSTREAM BLOCK (verified 2026-10-22): the legacy public SSR route
  # redirects to hiringcafe.com and returns a Cloudflare 403 challenge to this
  # non-browser client. Runs preserve the last successful snapshot. See README
  # before enabling, replacing, or attempting to work around this source.
  schedule:
    - cron: "57 16-23,0-3 * * *"
  workflow_dispatch:
    inputs:
      backfill:
        description: "One-time backfill: fetch last 61 days instead of last 30 days (run once when setting up)"
        required: false
        type: boolean
        default: false

concurrency:
  group: job-scraper-commit-push
  cancel-in-progress: false

jobs:
  scrape:
    name: HiringCafe scrape
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Scrape HiringCafe
        run: |
          if [ "${{ github.event.inputs.backfill }}" = "true" ]; then
            python scrape_jobs.py --hiringcafe-backfill
          else
            python scrape_jobs.py --hiringcafe-only
          fi
        env:
          PUSHOVER_TOKEN: ${{ secrets.PUSHOVER_TOKEN }}
          PUSHOVER_USER: ${{ secrets.PUSHOVER_USER }}
          NOTIFY_MIN_FIT: ${{ vars.NOTIFY_MIN_FIT }}

      - name: Record workflow run
        run: |
          python - <<'EOF'
          import json
          import os
          from datetime import datetime, timezone

          with open("output/hiringcafe_jobs.json", encoding="utf-8") as f:
              data = json.load(f)

          entry = {
              "workflow": "hiringcafe",
              "timestamp": datetime.now(timezone.utc).strftime("%Y-%m-%dT%H:%M:%SZ"),
              "job_count": int(data.get("total", 0)),
              "run_id": os.environ.get("GITHUB_RUN_ID", ""),
              "run_attempt": os.environ.get("GITHUB_RUN_ATTEMPT", ""),
          }

          with open("output/workflow_runs.jsonl", "a", encoding="utf-8") as f:
              f.write(json.dumps(entry, sort_keys=True) + "\n")
          EOF

      - name: Commit results to repo
        if: vars.ENABLE_DATA_COMMITS == 'true'
        run: |
          git config user.name  "${{ github.actor }}"
          git config user.email "${{ github.actor }}@users.noreply.github.com"
          git add -f output/hiringcafe_jobs.json output/hiringcafe_jobs.md output/hiringcafe_jobs.html output/workflow_runs.jsonl output/all_jobs.json output/notified.json
          git diff --cached --quiet || git commit -m "chore: update hiringcafe listings [$(date -u '+%Y-%m-%d %H:%MZ')]"
          git pull --rebase -X ours origin main
          git push
